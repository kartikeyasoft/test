---
- name: Install packages on Ubuntu AMI
  hosts: all
  become: yes
  vars:
    app_user: "eureka"
    app_name: "{{ lookup('env', 'SERVICE_NAME') }}"
    app_version: "{{ lookup('env', 'SERVICE_VERSION') }}"
    nexus_url: "{{ lookup('env', 'NEXUS_URL') }}"

  tasks:

    - name: Install all packages together
      apt:
        name:
          - openjdk-17-jdk
        state: present
        force_apt_get: yes
        install_recommends: no
      become: yes
      register: install_result
      until: install_result is success
      retries: 3
      delay: 10

    - name: Verify Java installation
      command: java -version
      register: java_version
      changed_when: false
      become: yes

    - name: Display Java version
      debug:
        msg: "{{ java_version.stderr_lines[0] }}"

    - name: Install AWS CLI v2
      block:
        - name: Download AWS CLI
          get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
          become: yes

        - name: Extract AWS CLI
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: yes
          become: yes

        - name: Install AWS CLI
          command: /tmp/aws/install
          become: yes
          args:
            creates: /usr/local/bin/aws

        - name: Clean up
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/awscliv2.zip
            - /tmp/aws
          become: yes

    - name: Create eureka user
      user:
        name: "{{ app_user }}"
        system: yes
        home: "/opt/{{ app_name }}"
        create_home: yes

    - name: Create application directory
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Create application.yml
      copy:
        dest: "/opt/{{ app_name }}/application.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
        content: |
          server:
            port: 8761
          
          eureka:
            instance:
              prefer-ip-address: true
              instance-id: ${spring.cloud.client.ip-address}:${server.port}
            client:
              register-with-eureka: false
              fetch-registry: false
              service-url:
                defaultZone: http://localhost:8761/eureka/
            server:
              enable-self-preservation: true
          
          management:
            endpoints:
              web:
                exposure:
                  include: health,info
          
          spring:
            cloud:
              inetutils:
                preferred-networks:
                  - 172.31

    - name: Download Eureka JAR from Nexus
      get_url:
        url: "https://raw.githubusercontent.com/kartikeyasoft/data/refs/heads/main/eureka-1.0.11.jar"
        dest: "/opt/{{ app_name }}/{{ app_name }}.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 10
      register: download_result
      until: download_result is success

    - name: Create systemd service file
      copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        content: |
          [Unit]
          Description=Eureka Service Registry
          After=network.target
          
          [Service]
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory=/opt/{{ app_name }}
          ExecStart=/usr/bin/java -jar /opt/{{ app_name }}/{{ app_name }}.jar --spring.config.location=file:/opt/{{ app_name }}/application.yml
          SuccessExitStatus=143
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start service
      systemd:
        name: "{{ app_name }}"
        enabled: yes
        state: started
        